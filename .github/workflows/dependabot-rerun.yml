name: Rerun deferred Dependabot builds

# build.yml's hours-gate defers Dependabot builds (no-op skip) during
# business hours (Mon-Fri 07:00-18:00 Europe/Warsaw) to keep the scarce
# github-actions-runner-new pool free for human PRs. This workflow finds any
# Dependabot PR whose latest build run had its "Build" job skipped and
# reruns it once business hours are over, so those builds/auto-merges
# resume automatically.
on:
  schedule:
    # 18:00 Europe/Warsaw is 16:00 UTC (CEST) or 17:00 UTC (CET) depending on
    # DST - fire at both times rather than hardcoding one offset. The gate
    # step below re-checks the real time before doing anything, so whichever
    # of the two fires "early" for the current season is a harmless no-op.
    - cron: '5 16 * * 1-5'
    - cron: '5 17 * * 1-5'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  rerun:
    name: Rerun skipped Dependabot builds
    # ubuntu-slim: just a date check plus a couple of `gh` calls, a few
    # seconds of work well within the 1 vCPU/15min budget.
    runs-on: ubuntu-slim
    steps:
      - name: Skip unless actually past business hours (Europe/Warsaw)
        id: gate
        run: |
          DOW=$(TZ='Europe/Warsaw' date +%u)
          HOUR=$((10#$(TZ='Europe/Warsaw' date +%H)))
          if [[ "$DOW" -ge 1 && "$DOW" -le 5 && "$HOUR" -ge 7 && "$HOUR" -lt 18 ]]; then
            echo "Still business hours in Europe/Warsaw - nothing to do yet."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rerun any Dependabot build left skipped by the business-hours gate
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ubuntu-slim's minimal image doesn't guarantee gh is preinstalled
          # the way ubuntu-latest's toolcache does.
          command -v gh >/dev/null || { sudo apt-get update -q && sudo apt-get install -y gh; }

          for pr_branch in $(gh pr list --repo "${{ github.repository }}" --author "app/dependabot" --state open --json headRefName --jq '.[].headRefName'); do
            run_id=$(gh run list --repo "${{ github.repository }}" --branch "$pr_branch" --workflow=build.yml --limit 1 --json databaseId --jq '.[0].databaseId')
            if [[ -z "$run_id" ]]; then
              continue
            fi

            # The workflow run's overall conclusion is "success" whenever the
            # hours-gate job succeeds and the Build job is merely skipped by
            # its "if" condition - only the Build job itself reports
            # "skipped". Check that job directly instead of the run-level
            # conclusion, otherwise deferred runs are never picked up here.
            build_conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs" --jq '.jobs[] | select(.name=="Build") | .conclusion')
            if [[ "$build_conclusion" == "skipped" ]]; then
              echo "Rerunning $pr_branch (run $run_id) - Build job was skipped by the business-hours gate"
              gh run rerun "$run_id" --repo "${{ github.repository }}"
            fi
          done
