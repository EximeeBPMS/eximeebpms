name: Snapshot release on main

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'NOTICE*'

permissions:
  contents: read

jobs:
  check-snapshot-version:
    runs-on: github-actions-runner-new
    outputs:
      is-snapshot: ${{ steps.probe.outputs.is-snapshot }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.0
      - name: Set up JDK
        uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: 21
      - name: Read the project version
        id: probe
        run: |
          # Asked of Maven, not grepped out of pom.xml: the first <version> in
          # the root pom belongs to the <parent> (eximeebpms-release-parent,
          # which carries a plain release version), so a naive grep reports the
          # parent and would skip every legitimate snapshot.
          version="$(./mvnw -q -N -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "project version: ${version}"
          if [[ "${version}" == *-SNAPSHOT ]]; then
            echo "is-snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-snapshot=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version ${version} is not a SNAPSHOT - skipping the snapshot release."
          fi

  call-snapshot-release:
    needs: check-snapshot-version
    if: needs.check-snapshot-version.outputs.is-snapshot == 'true'
    permissions:
      contents: write
      packages: write

    uses: ./.github/workflows/snapshots-release.yml
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      CPP_USERNAME: ${{ secrets.CPP_USERNAME }}
      CPP_PASSWORD: ${{ secrets.CPP_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
