name: Release

permissions:
  contents: write
  packages: write
  id-token: write  # required for Sigstore keyless signing

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release'
        required: true
      development_version:
        description: 'Next snapshot version (e.g., 1.2.2) without -SNAPSHOT suffix'
        required: true

jobs:
  release:
    runs-on: github-actions-runner-new
    steps:
      - name: Generate eximeebpmsrunner app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EXIMEEBPMSRUNNER_APP_ID }}
          private-key: ${{ secrets.EXIMEEBPMSRUNNER_APP_PRIVATE_KEY }}

      - name: Check out the code
        uses: actions/checkout@v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create custom settings.xml
        run: |
            mkdir -p ~/.m2-release
            cat <<EOF > ~/.m2-release/settings.xml
            <settings>
              <servers>
                <server>
                  <id>central</id>
                  <username>${CPP_USERNAME}</username>
                  <password>${CPP_PASSWORD}</password>
                </server>
                <server>
                  <id>github</id>
                  <username>${GITHUB_ACTOR}</username>
                  <password>${GITHUB_TOKEN}</password>
                </server>
              </servers>
            </settings>
            EOF
        env:
          CPP_USERNAME: ${{ secrets.CPP_USERNAME }}
          CPP_PASSWORD: ${{ secrets.CPP_PASSWORD }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode > private.key
          gpg --batch --import private.key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Configure Git user
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'

      - name: Configure Git HTTPS credentials for github.com
        # release:perform's checkout-project-from-scm phase does its own,
        # independent `git clone` into target/checkout - a fresh .git
        # directory that does NOT inherit the credential actions/checkout
        # persisted for the original working-copy checkout above (that one is
        # scoped locally to this job's already-checked-out repo). settings.xml's
        # <server id="github"> entry is not a reliable substitute here -
        # maven-scm's git-exe provider doesn't consistently pick up Maven
        # settings.xml server credentials for git operations the way Wagon
        # does for artifact deployment. eximeebpms-enterprise's identical
        # release.yml pattern hit "fatal: could not read Username ... terminal
        # prompts disabled" on a real release's "Release perform" step
        # (BPMS-688, 2026-09-10) - configure it explicitly here too with a
        # git credential store instead of depending on incidental/ambient
        # credential state.
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${GITHUB_TOKEN}@github.com" > ~/.git-credentials
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Cut CHANGELOG.md's [Unreleased] section into this release
        # Mirrors the same step in eximeebpms-enterprise's release.yml
        # (BPMS-688) - release.yml never touched CHANGELOG.md, so cutting
        # [Unreleased] into the released version's own header
        # (guidelines/common/release-checklist.md) was a fully manual step
        # that could be forgotten. OSS's CHANGELOG entries are authored
        # ticket-free (no BPMS-XXX prefixes) at curation time, unlike
        # enterprise's - this step doesn't change that, it only cuts
        # whatever is already sitting under [Unreleased] at release time.
        # Idempotent/no-op if [Unreleased] has no content.
        run: |
          VERSION="${{ github.event.inputs.release_version }}"
          DATE=$(date -u +%Y-%m-%d)
          python3 - "$VERSION" "$DATE" <<'PYEOF_CUT'
          import re, sys
          version, date = sys.argv[1], sys.argv[2]
          path = "CHANGELOG.md"
          with open(path) as f:
              content = f.read()
          pattern = re.compile(r"## \[Unreleased\]\n\n(?P<content>.*?)\n\n---\n\n(?=## \[)", re.S)
          m = pattern.search(content)
          if not m:
              print("Could not find an [Unreleased] section followed by another version header - leaving CHANGELOG.md untouched.")
              sys.exit(0)
          body = m.group("content").strip("\n")
          if not body:
              print("No content under [Unreleased] - nothing to cut, leaving CHANGELOG.md untouched.")
              sys.exit(0)
          replacement = f"## [Unreleased]\n\n---\n\n## [{version}] – {date}\n\n{body}\n\n---\n\n"
          content = content[:m.start()] + replacement + content[m.end():]
          with open(path, "w") as f:
              f.write(content)
          print(f"Cut [Unreleased] into [{version}] - {date}")
          PYEOF_CUT
          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            # [skip ci]: this commit touches CHANGELOG.md only. paths-ignore in the
            # push-triggered workflows already covers it; this is the belt to that
            # pair of braces, and survives someone relaxing paths-ignore later.
            git commit -m "Cut CHANGELOG.md [Unreleased] into this release [skip ci]"
            git push origin HEAD:main
          else
            echo "CHANGELOG.md unchanged - skipping commit."
          fi

      - name: Release prepare
        run: |
          ./mvnw release:prepare -B --settings ~/.m2-release/settings.xml -Dmaven.repo.local="${MAVEN_REPO_LOCAL}" -Darguments="-DskipTests -Dmaven.repo.local=${MAVEN_REPO_LOCAL}" \
            -Prelease,distro,distro-ce,javadocs,distro-serverless,distro-tomcat,distro-wildfly,distro-webjar,distro-run,distro-starter,check-engine,check-webapps,sonatype-oss-release \
            -DtagNameFormat=v@{project.version} \
            -DreleaseVersion=${{ github.event.inputs.release_version }} \
            -DdevelopmentVersion=${{ github.event.inputs.development_version }}-SNAPSHOT \
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Release perform
        run: |
          ./mvnw release:perform --settings ~/.m2-release/settings.xml -Dmaven.repo.local="${MAVEN_REPO_LOCAL}" -Dgoals="" \
          -Darguments="-DskipTests -Dmaven.repo.local=${MAVEN_REPO_LOCAL}"
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Deploy base libs (stage locally, no network)
        run: |
          cd target/checkout
          # -Ddistro.deploy.skip=true keeps the Tomcat and Run distributions out of the
          # staged bundle; they ship as GitHub Release assets instead (BPMS-760). The property
          # defaults to false, so snapshots-release.yml - which activates the same profiles -
          # still publishes them to Central's snapshot repository, where eximeebpms-docker
          # resolves SNAPSHOT builds from and where no upload bundle exists.
          ./mvnw deploy -Prelease,sonatype-oss-release -B --settings ~/.m2-release/settings.xml -Dmaven.repo.local="${MAVEN_REPO_LOCAL}" -DskipTests \
            -Ddistro.deploy.skip=true \
            -DaltDeploymentRepository=local::file:$(pwd)/target/staging-deploy
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Generate aggregate SBOM
        run: |
          cd target/checkout
          ./mvnw package -Psbom -B --settings ~/.m2-release/settings.xml -Dmaven.repo.local="${MAVEN_REPO_LOCAL}" -DskipTests
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Publish staged artifacts to Maven Central (JReleaser)
        # Pinned to a commit SHA, not @v2: this is a self-hosted runner, which caches actions
        # under _work/_actions keyed by ref string and can keep reusing an already-cached
        # checkout for a moving branch ref instead of re-resolving it. That silently ignored
        # java-opts below even after it was pushed and live on GitHub. A distinct ref (this SHA)
        # forces a fresh fetch. Corresponds to jreleaser/release-action v2.5.0.
        uses: jreleaser/release-action@97b5e2f0e845de2fe1dbbdf451ac6a21233fafff
        with:
          version: '1.25.0' # pinned: 'latest' (default) resolves via jreleaser.org, unreachable from this runner
          # Heap has to clear two bars at once. Too small and this fails with
          # "OutOfMemoryError: Java heap space": feign copies the bundle into a second
          # in-memory buffer while form-encoding, needing ~2-3x the file size in heap.
          # Too large and the *container* is killed instead: the runner pod's limits.memory
          # is 6Gi (devops-k8s-apps on master, services/common/github-actions-runner-new),
          # and that ceiling covers the heap plus metaspace, thread stacks, native buffers
          # and the runner agent itself. -Xmx6144m matched the pod limit to the byte and was
          # SIGKILLed twice on 2026-09-15 (exitCode 137, runs 34943032057 and 34957953619),
          # which GitHub surfaces only as "the self-hosted runner lost communication with
          # the server". 4 GiB leaves roughly 2 GiB of non-heap headroom under the limit.
          # If this ever fails with OutOfMemoryError instead of exitCode 137, the bundle has
          # outgrown the pod: raise the pod limit or split the upload, do not raise -Xmx.
          java-opts: '-Xmx4g'
          working-directory: target/checkout
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ github.event.inputs.release_version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.CPP_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.CPP_PASSWORD }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Collect SBOM
        run: |
          VERSION="${{ github.event.inputs.release_version }}"
          cp target/checkout/target/bom.json "sbom-${VERSION}.cdx.json"
          cp target/checkout/target/bom.xml  "sbom-${VERSION}.cdx.xml"

      - name: Collect distribution archives
        # All three distributions ship as GitHub Release assets, not on Maven Central - the same
        # place operaton publishes its own (BPMS-760). Central keeps the consumable libraries;
        # a 230MB application-server install is not something anyone resolves as a <dependency>,
        # and staging all of them made the JReleaser bundle 1057MB, which cannot be
        # multipart-encoded inside the runner pod's 6Gi memory limit. Without them the bundle is
        # 173MB, the size that released successfully in 1.3.0.
        #
        # Read from the workspace root, not target/checkout: "Release prepare" already builds
        # every distribution here at the release version, including WildFly, which is not in the
        # sonatype-oss-release reactor and therefore never appears under target/checkout.
        #
        # Fails loudly if an archive is missing: action-gh-release silently ignores a pattern
        # that matches nothing, so a broken path would drop the distributions from the release
        # without failing the run.
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.release_version }}"
          for f in \
            "distro/tomcat/distro/target/eximeebpms-bpm-tomcat-${VERSION}.tar.gz" \
            "distro/tomcat/distro/target/eximeebpms-bpm-tomcat-${VERSION}.zip" \
            "distro/run/distro/target/eximeebpms-bpm-run-${VERSION}.tar.gz" \
            "distro/run/distro/target/eximeebpms-bpm-run-${VERSION}.zip" \
            "distro/wildfly/distro/target/eximeebpms-bpm-wildfly-${VERSION}.tar.gz" \
            "distro/wildfly/distro/target/eximeebpms-bpm-wildfly-${VERSION}.zip"; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected distribution archive not found: $f"
              exit 1
            fi
            cp "$f" .
            echo "collected $(basename "$f") ($(du -h "$f" | cut -f1))"
          done

      - name: GPG-sign SBOM
        run: |
          for f in sbom-*.cdx.json sbom-*.cdx.xml; do
            gpg --batch --yes --armor \
                --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --detach-sign "$f"
          done
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign SBOM with Sigstore (cosign keyless)
        run: |
          for f in sbom-*.cdx.json sbom-*.cdx.xml; do
            cosign sign-blob --yes "$f" \
                --bundle "${f}.sigstore.bundle"
          done

      - name: Get release commit info
        id: release_commit
        run: |
          TAG="v${{ github.event.inputs.release_version }}"
          {
            echo "timestamp=$(git log -1 --format=%cI "$TAG")"
            echo "message<<COMMIT_EOF"
            git log -1 --format=%s "$TAG"
            echo "COMMIT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: Release v${{ github.event.inputs.release_version }}
          tag_name: v${{ github.event.inputs.release_version }}
          draft: false
          prerelease: false
          files: |
            sbom-*.cdx.json
            sbom-*.cdx.json.asc
            sbom-*.cdx.json.sigstore.bundle
            sbom-*.cdx.xml
            sbom-*.cdx.xml.asc
            sbom-*.cdx.xml.sigstore.bundle
            eximeebpms-bpm-tomcat-*.tar.gz
            eximeebpms-bpm-tomcat-*.zip
            eximeebpms-bpm-run-*.tar.gz
            eximeebpms-bpm-run-*.zip
            eximeebpms-bpm-wildfly-*.tar.gz
            eximeebpms-bpm-wildfly-*.zip
          body: |
            Release generated on ${{ steps.release_commit.outputs.timestamp }}
            with commit message: ${{ steps.release_commit.outputs.message }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

#  Invoking snapshot release to provide the necessary snapshots for testing in CustomJacksonDateFormatTest
  call-snapshot-release:
    needs: release
    permissions:
      contents: write
      packages: write

    uses: ./.github/workflows/snapshots-release.yml

    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      CPP_USERNAME: ${{ secrets.CPP_USERNAME }}
      CPP_PASSWORD: ${{ secrets.CPP_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
