name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1' # weekly, Monday 03:30 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Buildless languages: no Maven build needed, so these run on ubuntu-slim instead of
  # the self-hosted pool, and can afford to run on every pull_request too.
  analyze-buildless:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-slim
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, ruby, actions]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # java-kotlin needs github-actions-runner-new (self-hosted) for a real Maven build
  # (build-mode: manual gives more accurate Java analysis than buildless extraction,
  # matching build.yml). Skipped on pull_request - running its self-hosted mvnw build
  # on every PR would double runner load on top of build.yml; push-to-main + weekly is
  # the same cadence CIB seven uses for their CodeQL scan. A plain job-level `if` (no
  # matrix here) is enough to skip it, unlike the buildless job above.
  analyze-java-kotlin:
    name: Analyze (java-kotlin)
    if: github.event_name != 'pull_request'
    runs-on: github-actions-runner-new
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        run: |
          if java -version 2>&1 | grep -qE '"21\.'; then
            echo "Java 21 already installed"
          else
            echo "Java 21 not found, installing via package manager..."
            sudo apt-get update -q
            sudo apt-get install -y openjdk-21-jdk
          fi
          JAVA_HOME=$(java -XshowSettings:properties -version 2>&1 | grep 'java.home' | awk '{print $3}')
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          java -version

      - name: Create custom settings.xml
        run: |
          mkdir -p ~/.m2-codeql
          cat <<EOF > ~/.m2-codeql/settings.xml
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Maven packages
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.m2/repository
          key: ${{ runner.os }}-maven-codeql-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Remove corrupted Maven cache files
        run: find ${{ github.workspace }}/.m2/repository -name "*.xml" -empty -delete 2>/dev/null || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build (compile only, tests not needed for analysis)
        # -U: the restore-keys fallback above can serve a cache blob predating a
        # parent POM version bump, and Maven's default 24h "don't recheck" policy
        # would otherwise fail the build with a non-resolvable parent POM until the
        # cache key changes again.
        run: ./mvnw -B -T 1C -U --settings ~/.m2-codeql/settings.xml verify -DskipTests
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune own artifacts before caching
        if: success()
        run: mkdir -p ${{ github.workspace }}/.m2/repository && rm -rf ${{ github.workspace }}/.m2/repository/org/eximeebpms/{bpm,commons,connect,spin,template-engines}

      - name: Save Maven packages
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.m2/repository
          key: ${{ runner.os }}-maven-codeql-${{ hashFiles('**/pom.xml') }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
