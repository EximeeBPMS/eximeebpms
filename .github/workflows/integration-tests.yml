name: Integration Tests

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run tests on'
        required: true
        default: 'main'
        type: string
      java_version:
        description: 'Java version to use'
        type: choice
        required: true
        default: '["21", "25"]'
        options:
          - '["21"]'
          - '["25"]'
          - '["21", "25"]'
      testsuite:
        description: 'Integration test suite to run'
        type: choice
        required: true
        default: '["engine"]'
        options:
          - '["engine"]'
          - '["webapps"]'
          - '["engine", "webapps"]'
          - '["instance-migration"]'
          - '["rolling-update"]'
          - '["old-engine"]'
          - '["instance-migration", "rolling-update", "old-engine"]'
          - '["engine", "webapps", "instance-migration", "rolling-update", "old-engine"]'
      container:
        description: 'Container to use for integration tests'
        type: choice
        required: true
        default: '["tomcat"]'
        options:
          - '["tomcat"]'
          - '["wildfly"]'
          - '["tomcat", "wildfly"]'
      database:
        description: 'Database to use for integration tests'
        type: choice
        required: true
        default: '["h2", "postgresql"]'
        options:
          - '["h2"]'
          - '["postgresql"]'
          - '["mysql"]'
          - '["sqlserver"]'
          - '["h2", "postgresql"]'
          - '["h2", "postgresql", "mysql", "sqlserver"]'

permissions:
  contents: read
  checks: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Integration Tests
    runs-on: github-actions-runner-new
    strategy:
      fail-fast: false
      # Never occupy the full self-hosted pool: with only 2 org-wide runner
      # slots, keeping this at 1 guarantees a PR build (build.yml) always has
      # somewhere to run, even while this matrix is still working through its
      # queue.
      max-parallel: 1
      matrix:
        java: ${{ fromJson(github.event.inputs.java_version || '["21", "25"]') }}
        testsuite: ${{ fromJson(github.event.inputs.testsuite || '["engine", "webapps", "instance-migration", "rolling-update", "old-engine"]') }}
        distro: ${{ fromJson(github.event.inputs.container || '["tomcat", "wildfly"]') }}
        database: ${{ fromJson(github.event.inputs.database || '["h2", "postgresql"]') }}
        exclude:
          # Migration suites don't deploy to a server distro; wildfly is excluded as meaningless
          - testsuite: instance-migration
            distro: wildfly
          - testsuite: rolling-update
            distro: wildfly
          - testsuite: old-engine
            distro: wildfly
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch || 'main' }}
      - name: Cache Maven packages
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Cache npm packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm
      - name: Set up Java
        id: setup-java
        uses: actions/setup-java@v5.4.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          overwrite-settings: false
        continue-on-error: true

      - name: Set up Java (fallback to pre-installed)
        if: steps.setup-java.outcome == 'failure'
        run: |
          echo "setup-java failed (likely DNS), falling back to pre-installed Java"
          JAVA_BIN=$(readlink -f "$(which java)")
          JAVA_HOME_VAL=$(dirname "$(dirname "$JAVA_BIN")")
          echo "JAVA_HOME=$JAVA_HOME_VAL" >> $GITHUB_ENV
          echo "$JAVA_HOME_VAL/bin" >> $GITHUB_PATH
          java -version

      - name: Create custom settings.xml
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <localRepository>${{ github.workspace }}/.m2/repository</localRepository>
            <profiles>
              <profile>
                <id>postgresql</id>
                <properties>
                  <database.url>jdbc:postgresql://localhost:5432/process-engine</database.url>
                  <database.username>eximeebpms</database.username>
                  <database.password>eximeebpms</database.password>
                </properties>
              </profile>
              <profile>
                <id>mysql</id>
                <properties>
                  <database.url>jdbc:mysql://localhost:3306/process-engine?serverTimezone=UTC</database.url>
                  <database.username>eximeebpms</database.username>
                  <database.password>eximeebpms</database.password>
                </properties>
              </profile>
              <profile>
                <id>sqlserver</id>
                <properties>
                  <database.url>jdbc:sqlserver://localhost:1433;DatabaseName=process-engine;trustServerCertificate=true</database.url>
                  <database.username>sa</database.username>
                  <database.password>EximeeBpms1!</database.password>
                </properties>
              </profile>
            </profiles>
          </settings>
          EOF

      - name: Remove corrupted Maven cache files
        run: find ${{ github.workspace }}/.m2/repository -name "*.xml" -empty -delete 2>/dev/null || true

      - name: Start PostgreSQL
        if: matrix.database == 'postgresql'
        run: |
          docker run -d --name postgres-test \
            -e POSTGRES_DB=process-engine \
            -e POSTGRES_USER=eximeebpms \
            -e POSTGRES_PASSWORD=eximeebpms \
            -p 5432:5432 \
            postgres:13
          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 30); do
            docker exec postgres-test pg_isready -U eximeebpms && break
            sleep 2
          done

      - name: Start MySQL
        if: matrix.database == 'mysql'
        run: |
          docker run -d --name mysql-test \
            -e MYSQL_DATABASE=process-engine \
            -e MYSQL_USER=eximeebpms \
            -e MYSQL_PASSWORD=eximeebpms \
            -e MYSQL_ROOT_PASSWORD=eximeebpms \
            -p 3306:3306 \
            mysql:8 --transaction-isolation=READ-COMMITTED
          echo "Waiting for MySQL to be ready..."
          for i in $(seq 1 30); do
            docker exec mysql-test mysqladmin ping -u root --password=eximeebpms --silent && break
            sleep 2
          done

      - name: Start MSSQL
        if: matrix.database == 'sqlserver'
        run: |
          docker run -d --name mssql-test \
            -e ACCEPT_EULA=Y \
            -e SA_PASSWORD=EximeeBpms1! \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2019-latest
          echo "Waiting for MSSQL to be ready..."
          for i in $(seq 1 30); do
            docker exec mssql-test /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P EximeeBpms1! -No -Q "SELECT 1" 2>/dev/null && break
            sleep 2
          done
          docker exec mssql-test /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P EximeeBpms1! -No \
            -Q "CREATE DATABASE [process-engine]"

      - name: Maven Build
        id: maven-build
        shell: bash
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
        run: |
          .github/scripts/run-integration-tests.sh --testsuite=${{ matrix.testsuite }} --distro=${{ matrix.distro }} --db=${{ matrix.database }} --no-test
      - name: Install Chrome for Testing
        if: contains(matrix.testsuite, 'webapps')
        run: |
          # Install google-chrome-stable so apt resolves all shared library dependencies
          curl -sSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/google-chrome.deb
          sudo apt-get update -q
          sudo apt-get install -y /tmp/google-chrome.deb
          rm /tmp/google-chrome.deb
          # Replace the Chrome binary with the version that matches the pinned ChromeDriver
          CHROME_VERSION=$(grep -m1 'version.chromedriver' qa/integration-tests-webapps/pom.xml | sed 's/.*>\(.*\)<.*/\1/')
          curl -sSL "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip" -o /tmp/chrome-linux64.zip
          unzip -q /tmp/chrome-linux64.zip -d /tmp/
          sudo mv /tmp/chrome-linux64 /opt/chrome-for-testing
          sudo chmod +x /opt/chrome-for-testing/chrome
          sudo ln -sf /opt/chrome-for-testing/chrome /usr/bin/google-chrome
          rm /tmp/chrome-linux64.zip
          echo "Pinned Chrome-for-Testing version: ${CHROME_VERSION}"
          echo "/usr/bin/google-chrome -> $(readlink -f /usr/bin/google-chrome)"
          google-chrome --version
          if [ -x /opt/google/chrome/chrome ]; then
            echo "apt-installed Chrome (not used by tests, kept only for shared libs): $(/opt/google/chrome/chrome --version)"
          fi

      - name: Execute Integration Tests
        id: maven-integration-tests
        shell: bash
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
        run: |
          .github/scripts/run-integration-tests.sh --testsuite=${{ matrix.testsuite }} --distro=${{ matrix.distro }} --db=${{ matrix.database }} --no-build
      - name: Stop PostgreSQL
        if: always() && matrix.database == 'postgresql'
        run: docker stop postgres-test && docker rm postgres-test || true

      - name: Stop MySQL
        if: always() && matrix.database == 'mysql'
        run: docker stop mysql-test && docker rm mysql-test || true

      - name: Stop MSSQL
        if: always() && matrix.database == 'sqlserver'
        run: docker stop mssql-test && docker rm mssql-test || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: surefire-reports-${{ matrix.testsuite }}-${{ matrix.distro }}-${{ matrix.database }}
          path: |
            ${{ github.workspace }}/**/target/surefire-reports/**
            ${{ github.workspace }}/**/target/failsafe-reports/**
            ${{ github.workspace }}/qa/**/target/**/logs/**
            ${{ github.workspace }}/**/target/cargo.log
            ${{ github.workspace }}/**/target/selenium-screenshots/**
          retention-days: 30
